name: Rilascio 0ics

# The release the Mac Studio installs (ubuntu-ai, stack `mac`): the oMLX wheel with the native kernels built as in
# build-wheels.yml (Python 3.11 only), the wheels of the git dependencies (git-0ics.in: uv cannot hash a git requirement),
# requisiti.txt with the hashes of the PyPI packages (requisiti-0ics.in, the exact closure of the venv in service) and
# SHA256SUMS over all of them. The clean install below is the one the Mac does.

on:
  push:
    tags: ["v*-0ics.*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    env:
      # As build-wheels.yml: the separate NAX library needs SDK 26.5.
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.6"

      - name: Build the oMLX wheel with the native custom kernels
        env:
          OMLX_WITH_CUSTOM_KERNEL: "1"
          # The native extensions are arm64 only, while setup-python's Python is universal2: without this the wheel
          # is tagged universal2 and would claim to run on an Intel Mac.
          _PYTHON_HOST_PLATFORM: macosx-15.0-arm64
        run: |
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          python -m pip install --upgrade pip
          python -m pip install build setuptools wheel "cmake>=3.27" "nanobind==3.1.0" "mlx==0.32.4"
          CMAKE_ARGS="-DPython_EXECUTABLE=$(python -c 'import sys; print(sys.executable)')"
          export CMAKE_ARGS
          python -m build --wheel --no-isolation
          ls dist/omlx-*-cp311-*-macosx_*_arm64.whl || { echo "the wheel is not tagged arm64"; exit 1; }
          unzip -l dist/omlx-*.whl | grep -E "_ext|dylib|metallib" || { echo "no native artifacts in wheel"; exit 1; }
          unzip -l dist/omlx-*.whl | grep -q "omlx_web/templates/dashboard.html" || { echo "web UI missing from wheel"; exit 1; }

      - name: Build the wheels of the git dependencies
        run: python -m pip wheel --no-deps -r git-0ics.in -w dist/

      - name: Lock the PyPI packages with their hashes
        # The Mac's Python (3.11.18: soupsieve 3.0.4 wants >=3.11.5) and macOS (27: mlx 0.32.4 has no macosx_13 wheel).
        env:
          MACOSX_DEPLOYMENT_TARGET: "26.0"
        run: |
          uv pip compile requisiti-0ics.in --no-deps --generate-hashes --python-version 3.11.18 \
            --python-platform aarch64-apple-darwin -o dist/requisiti.txt

      - name: Clean install as on the Mac, then the smoke test
        run: |
          uv venv --python 3.11 /tmp/prova
          uv pip install --python /tmp/prova/bin/python --require-hashes --no-deps -r dist/requisiti.txt
          uv pip install --python /tmp/prova/bin/python --no-deps dist/*.whl
          # from outside the checkout, so that `import omlx` is the installed wheel
          cd /tmp
          /tmp/prova/bin/python - <<'PY'
          import mlx.core as mx
          import mlx_audio, mlx_embeddings, mlx_lm, mlx_vlm  # noqa: F401  the git dependencies
          from omlx.custom_kernels import native_kernel_status

          failed = []
          for pkg, report in native_kernel_status().items():
              ok = bool(report["available"])
              print(f"{pkg}: native_available={ok} import_error={report['import_error']}")
              if not ok:
                  failed.append(pkg)
          if failed:
              raise SystemExit(f"native kernels missing from wheel: {failed}")

          from omlx.custom_kernels.attention import fast as attention_fast

          mx.random.seed(3142)
          q = mx.random.normal((1, 4, 1, 64)).astype(mx.float16)
          k = mx.random.normal((1, 2, 128, 64)).astype(mx.float16)
          v = mx.random.normal((1, 2, 128, 64)).astype(mx.float16)
          if not attention_fast._ext.sdpa_decode_supported(q, k, v):
              raise SystemExit("sdpa_decode rejected the wheel smoke shape")
          out = attention_fast.sdpa_decode(q, k, v, 64 ** -0.5)
          ref = mx.fast.scaled_dot_product_attention(q, k, v, scale=64 ** -0.5)
          mx.eval(out, ref)
          error = mx.max(mx.abs(out.astype(mx.float32) - ref.astype(mx.float32))).item()
          print(f"sdpa_decode: shape={out.shape} max_abs={error}")
          if error >= 5e-3:
              raise SystemExit(f"sdpa_decode mismatch: max_abs={error}")
          PY

      - name: SHA256SUMS
        working-directory: dist
        run: |
          shasum -a 256 -- *.whl requisiti.txt > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rilascio
          path: dist/
          if-no-files-found: error

  release:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rilascio
          path: dist

      - name: Create the release of the tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" \
            --notes "oMLX ds-0ics for the Mac Studio: wheel with native kernels (Python 3.11), git dependency wheels, requisiti.txt with hashes, SHA256SUMS."
